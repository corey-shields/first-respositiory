<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firefly Maze</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one centered arcade cabinet — HUD strip, maze canvas, touch pad below on phones. Single dark "night garden" look by choice. */
:root {
  --night: #0b1020;
  --night-2: #121a30;
  --hedge: #3ddc97;
  --glow: #ffd25e;
  --ink: #e8ecf8;
  --muted: #8a94b8;
  --rose: #ff6b8b;
  --font-display: "Bungee", "Impact", system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 0%, var(--night-2), var(--night) 70%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--font-mono);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.cabinet { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; letter-spacing: 0.02em;
  color: var(--glow); text-shadow: 0 0 12px rgba(255, 210, 94, 0.55);
}
.controls { display: flex; gap: 6px; }
.controls button, .pad button {
  font: inherit; color: var(--ink); background: var(--night-2); border: 1px solid #2a3558; border-radius: 6px;
  padding: 4px 10px; cursor: pointer;
}
.controls button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-variant-numeric: tabular-nums; }
.hud div { display: flex; flex-direction: column; }
.hud small { color: var(--muted); font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; }
.hud b { font-size: 1.05rem; }
.stage { position: relative; width: 100%; aspect-ratio: 19 / 21; max-width: 100%; }
canvas { width: 100%; height: 100%; display: block; border-radius: 10px; background: #070b17; box-shadow: 0 0 0 1px #1d2745, 0 20px 60px rgba(0,0,0,0.5); }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 20px; pointer-events: none;
}
.overlay h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; color: var(--glow); text-shadow: 0 0 14px rgba(255,210,94,.6); text-wrap: balance; }
.overlay p { margin: 0; color: var(--ink); max-width: 30ch; line-height: 1.5; text-shadow: 0 1px 3px #000; }
.overlay .key { color: var(--hedge); font-weight: 700; }
.overlay.dim { background: rgba(7, 11, 23, 0.72); border-radius: 10px; }
.help { color: var(--muted); font-size: 0.75rem; line-height: 1.5; margin: 0; }
.pad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; }
.pad button { font-size: 1.4rem; border-radius: 12px; }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) { .pad { display: grid; } .help.keys { display: none; } }
</style>
</head>
<body>
<div class="cabinet">
  <header>
    <h1>Firefly Maze</h1>
    <div class="controls">
      <button id="btn-pause" type="button" aria-label="Pause">Pause</button>
      <button id="btn-sound" type="button" aria-label="Toggle sound">Sound: on</button>
    </div>
  </header>
  <div class="hud" aria-live="polite">
    <div><small>Score</small><b id="hud-score">0</b></div>
    <div><small>Best</small><b id="hud-best">0</b></div>
    <div><small>Night</small><b id="hud-level">1</b></div>
    <div><small>Lives</small><b id="hud-lives">3</b></div>
  </div>
  <div class="stage">
    <canvas id="game" width="456" height="504" aria-label="Game board"></canvas>
    <div class="overlay dim" id="overlay">
      <h2 id="ov-title">Firefly Maze</h2>
      <p id="ov-text">Eat every glow seed in the hedge maze. Grab a <span class="key">flare</span> to make the moths flee, then catch them.</p>
      <p id="ov-hint"><span class="key">Press Enter or tap</span> to start</p>
    </div>
  </div>
  <div class="pad" aria-label="Direction pad">
    <button class="up" data-dir="up" type="button" aria-label="Up">▲</button>
    <button class="left" data-dir="left" type="button" aria-label="Left">◀</button>
    <button class="down" data-dir="down" type="button" aria-label="Down">▼</button>
    <button class="right" data-dir="right" type="button" aria-label="Right">▶</button>
  </div>
  <p class="help keys">Arrow keys or WASD to move · P to pause · M to mute · Swipe on touch screens</p>
</div>

<script>
(() => {
"use strict";

// ---------- Maze ----------
// # hedge wall   . glow seed   o flare (power-up)   - moth nest gate   G nest   P firefly start   (space) empty
const MAP = [
  "###################",
  "#........#........#",
  "#o##.###.#.###.##o#",
  "#.................#",
  "#.##.#.#####.#.##.#",
  "#....#...#...#....#",
  "####.###.#.###.####",
  "####.#.......#.####",
  "####.#.##-##.#.####",
  ".......#GGG#.......",
  "####.#.#####.#.####",
  "####.#.......#.####",
  "####.#.#####.#.####",
  "#........#........#",
  "#.##.###.#.###.##.#",
  "#o.#.....P.....#.o#",
  "##.#.#.#####.#.#.##",
  "#....#...#...#....#",
  "#.######.#.######.#",
  "#.................#",
  "###################",
];
const COLS = MAP[0].length, ROWS = MAP.length, TILE = 24;
const TUNNEL_ROW = 9;
const NEST_EXIT = { x: 9, y: 7 };
const NEST_CENTER = { x: 9, y: 9 };
const BONUS_TILE = { x: 9, y: 11 };

const DIRS = {
  up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
};
const DIR_ORDER = ["up", "left", "down", "right"];
const OPP = { up: "down", down: "up", left: "right", right: "left" };

let grid;       // 2D array of chars (mutable copy for seeds)
let seedsLeft;

function resetGrid() {
  grid = MAP.map(r => r.split(""));
  seedsLeft = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] === "." || grid[y][x] === "o") seedsLeft++;
  }
}
resetGrid();
const TOTAL_SEEDS = seedsLeft;

function cell(x, y) {
  if (y < 0 || y >= ROWS) return "#";
  if (x < 0 || x >= COLS) return y === TUNNEL_ROW ? " " : "#";
  return grid[y][x];
}
function isWall(c) { return c === "#"; }
function playerCanEnter(x, y) { const c = cell(x, y); return !isWall(c) && c !== "-" && c !== "G"; }
function mothCanEnter(m, x, y) {
  const c = cell(x, y);
  if (isWall(c)) return false;
  if (c === "-" || c === "G") return m.state === "leaving" || m.state === "eaten";
  return true;
}

// BFS distance maps for routing moths in and out of the nest
function bfsFrom(target) {
  const dist = Array.from({ length: ROWS }, () => new Array(COLS).fill(Infinity));
  const q = [[target.x, target.y]];
  dist[target.y][target.x] = 0;
  while (q.length) {
    const [x, y] = q.shift();
    for (const k of DIR_ORDER) {
      let nx = x + DIRS[k].x, ny = y + DIRS[k].y;
      if (nx < 0) nx = COLS - 1; if (nx >= COLS) nx = 0;
      if (ny < 0 || ny >= ROWS) continue;
      if (MAP[ny][nx] === "#") continue;
      if (dist[ny][nx] > dist[y][x] + 1) { dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return dist;
}
const DIST_TO_EXIT = bfsFrom(NEST_EXIT);
const DIST_TO_NEST = bfsFrom(NEST_CENTER);

// ---------- Canvas & assets ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = COLS * TILE * DPR;
canvas.height = ROWS * TILE * DPR;
ctx.scale(DPR, DPR);

function buildMazeLayer(color) {
  const c = document.createElement("canvas");
  c.width = COLS * TILE * DPR; c.height = ROWS * TILE * DPR;
  const g = c.getContext("2d");
  g.scale(DPR, DPR);
  g.lineCap = "round";
  const inset = 5;
  const strokeEdges = () => {
    g.beginPath();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (MAP[y][x] !== "#") continue;
      const px = x * TILE, py = y * TILE;
      const open = (dx, dy) => {
        const nx = x + dx, ny = y + dy;
        if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS) return false;
        return MAP[ny][nx] !== "#";
      };
      if (open(0, -1)) { g.moveTo(px + (open(-1,0)?inset:0), py + inset); g.lineTo(px + TILE - (open(1,0)?inset:0), py + inset); }
      if (open(0, 1))  { g.moveTo(px + (open(-1,0)?inset:0), py + TILE - inset); g.lineTo(px + TILE - (open(1,0)?inset:0), py + TILE - inset); }
      if (open(-1, 0)) { g.moveTo(px + inset, py + (open(0,-1)?inset:0)); g.lineTo(px + inset, py + TILE - (open(0,1)?inset:0)); }
      if (open(1, 0))  { g.moveTo(px + TILE - inset, py + (open(0,-1)?inset:0)); g.lineTo(px + TILE - inset, py + TILE - (open(0,1)?inset:0)); }
    }
  };
  // soft hedge fill
  g.fillStyle = "rgba(61, 220, 151, 0.07)";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (MAP[y][x] === "#") g.fillRect(x * TILE, y * TILE, TILE, TILE);
  }
  g.strokeStyle = color; g.lineWidth = 2.5; g.shadowColor = color; g.shadowBlur = 10;
  strokeEdges(); g.stroke();
  g.shadowBlur = 0; g.lineWidth = 1.2; g.strokeStyle = "rgba(255,255,255,0.35)";
  strokeEdges(); g.stroke();
  // nest gate
  g.strokeStyle = "#ff9ec4"; g.lineWidth = 3; g.shadowColor = "#ff9ec4"; g.shadowBlur = 8;
  g.beginPath(); g.moveTo(9 * TILE + 2, 8 * TILE + TILE / 2); g.lineTo(10 * TILE - 2, 8 * TILE + TILE / 2); g.stroke();
  return c;
}
const MAZE_NORMAL = buildMazeLayer("#3ddc97");
const MAZE_FLASH = buildMazeLayer("#f4f7ff");

// ---------- Sound ----------
let audio = null, soundOn = true;
function beep(freq, dur = 0.06, type = "square", vol = 0.05, slideTo) {
  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* audio unavailable */ }
}
let seedTick = 0;
const sfx = {
  seed() { seedTick ^= 1; beep(seedTick ? 660 : 520, 0.05, "triangle", 0.04); },
  flare() { beep(220, 0.35, "sawtooth", 0.05, 880); },
  catchMoth() { beep(300, 0.25, "square", 0.05, 1400); },
  bonus() { beep(880, 0.08, "triangle", 0.06); setTimeout(() => beep(1320, 0.12, "triangle", 0.06), 80); },
  die() { beep(700, 1.1, "sawtooth", 0.06, 60); },
  start() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle", 0.06), i * 130)); },
  life() { [784, 988, 1175].forEach((f, i) => setTimeout(() => beep(f, 0.1, "square", 0.05), i * 90)); },
};

// ---------- Storage ----------
function loadBest() { try { return parseInt(localStorage.getItem("firefly-maze-best") || "0", 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem("firefly-maze-best", String(v)); } catch (e) { /* ignore */ } }

// ---------- Entities ----------
// Every mover sits on tile (tx,ty) heading `dir`, `prog` (0..1) of the way to the next tile.
function makeMover(x, y) { return { tx: x, ty: y, dir: null, prog: 0 }; }
function posOf(e) {
  const d = e.dir ? DIRS[e.dir] : { x: 0, y: 0 };
  return { x: e.tx + d.x * e.prog, y: e.ty + d.y * e.prog };
}
function wrapX(e) { if (e.tx < 0) e.tx += COLS; if (e.tx >= COLS) e.tx -= COLS; }

const MOTH_DEFS = [
  { name: "Rosa",  color: "#ff6b8b", home: { x: 9,  y: 9 }, corner: { x: COLS - 2, y: -3 }, release: 0 },
  { name: "Lila",  color: "#c38bff", home: { x: 9,  y: 9 }, corner: { x: 1, y: -3 }, release: 2.5 },
  { name: "Tide",  color: "#43d6e8", home: { x: 8,  y: 9 }, corner: { x: COLS - 1, y: ROWS + 1 }, release: 6 },
  { name: "Amber", color: "#ffa64d", home: { x: 10, y: 9 }, corner: { x: 0, y: ROWS + 1 }, release: 10 },
];

const state = {
  phase: "title", // title | ready | play | dying | clear | over
  paused: false,
  score: 0, best: loadBest(), level: 1, lives: 3, extraGiven: false,
  phaseTimer: 0,
  modeIndex: 0, modeTimer: 0,
  frightTimer: 0, catchCombo: 0,
  seedsEaten: 0,
  bonus: null, // {value, timer}
  popups: [],
  time: 0,
  levelTime: 0,
};
let player, moths;
const MODE_SCHEDULE = [
  ["scatter", 7], ["chase", 20], ["scatter", 7], ["chase", 20], ["scatter", 5], ["chase", Infinity],
];

function speeds() {
  const L = Math.min(state.level, 8);
  return {
    player: 7.2 + L * 0.25,
    moth: 6.4 + L * 0.35,
    fright: 3.8 + L * 0.1,
    tunnel: 3.4,
    eaten: 15,
    nest: 4,
    frightTime: Math.max(1.5, 7 - (state.level - 1) * 0.75),
  };
}

function resetActors() {
  player = makeMover(9, 15);
  player.dir = "left"; player.want = "left"; player.face = "left";
  moths = MOTH_DEFS.map((d, i) => {
    const m = makeMover(d.home.x, d.home.y);
    Object.assign(m, d);
    m.index = i;
    m.state = i === 0 ? "leaving" : "nest";
    m.frightened = false;
    m.releaseAt = d.release * Math.max(0.4, 1 - (state.level - 1) * 0.15);
    m.dir = null;
    return m;
  });
  // Rosa starts just above the gate, already out.
  moths[0].tx = 9; moths[0].ty = 7; moths[0].state = "active"; moths[0].dir = "left";
  state.modeIndex = 0; state.modeTimer = 0; state.frightTimer = 0; state.levelTime = 0;
}

function currentMode() { return MODE_SCHEDULE[state.modeIndex][0]; }

// ---------- Movement ----------
function advance(e, dist, decide, canEnter) {
  let guard = 0;
  while (dist > 1e-9 && guard++ < 20) {
    if (e.prog === 0) {
      decide(e);
      if (!e.dir) return;
      const d = DIRS[e.dir];
      if (!canEnter(e.tx + d.x, e.ty + d.y)) { e.stopped = true; return; }
      e.stopped = false;
    }
    const need = 1 - e.prog;
    if (dist < need) { e.prog += dist; return; }
    dist -= need;
    const d = DIRS[e.dir];
    e.tx += d.x; e.ty += d.y; e.prog = 0;
    wrapX(e);
    if (e.onTile) e.onTile(e);
  }
}

function playerDecide(p) {
  if (p.want) {
    const w = DIRS[p.want];
    if (playerCanEnter(p.tx + w.x, p.ty + w.y)) { p.dir = p.want; }
  }
  if (p.dir) p.face = p.dir;
}

function eatAt(x, y) {
  const c = cell(x, y);
  if (c === "." || c === "o") {
    grid[y][x] = " ";
    seedsLeft--; state.seedsEaten++;
    if (c === ".") { addScore(10); sfx.seed(); }
    else { addScore(50); startFright(); sfx.flare(); }
    if (state.seedsEaten === 60 || state.seedsEaten === 140) spawnBonus();
    if (seedsLeft === 0) { state.phase = "clear"; state.phaseTimer = 0; }
  }
}

function startFright() {
  state.frightTimer = speeds().frightTime;
  state.catchCombo = 0;
  for (const m of moths) {
    if (m.state === "active") { m.frightened = true; reverse(m); }
    else if (m.state === "nest" || m.state === "leaving") m.frightened = true;
  }
}

function reverse(m) {
  if (!m.dir) return;
  if (m.prog > 0) {
    const d = DIRS[m.dir];
    m.tx += d.x; m.ty += d.y; wrapX(m);
    m.prog = 1 - m.prog;
  }
  m.dir = OPP[m.dir];
}

function mothTarget(m) {
  const p = player;
  const pd = DIRS[p.face || "left"];
  if (currentMode() === "scatter") return m.corner;
  switch (m.index) {
    case 0: return { x: p.tx, y: p.ty }; // Rosa: straight at you
    case 1: return { x: p.tx + pd.x * 4, y: p.ty + pd.y * 4 }; // Lila: cuts you off ahead
    case 2: { // Tide: pincer with Rosa
      const ax = p.tx + pd.x * 2, ay = p.ty + pd.y * 2;
      const r = moths[0];
      return { x: ax * 2 - r.tx, y: ay * 2 - r.ty };
    }
    default: { // Amber: chases when far, drifts off when close
      const dx = m.tx - p.tx, dy = m.ty - p.ty;
      return dx * dx + dy * dy > 64 ? { x: p.tx, y: p.ty } : m.corner;
    }
  }
}

function mothDecide(m) {
  if (m.state === "nest") { m.dir = null; return; }
  const options = DIR_ORDER.filter(k => {
    const d = DIRS[k];
    return mothCanEnter(m, m.tx + d.x, m.ty + d.y);
  });
  if (m.state === "leaving" || m.state === "eaten") {
    const map = m.state === "leaving" ? DIST_TO_EXIT : DIST_TO_NEST;
    let best = null, bd = Infinity;
    for (const k of options) {
      let nx = m.tx + DIRS[k].x, ny = m.ty + DIRS[k].y;
      if (nx < 0) nx = COLS - 1; if (nx >= COLS) nx = 0;
      const v = map[ny][nx];
      if (v < bd) { bd = v; best = k; }
    }
    m.dir = best;
    return;
  }
  let choices = options.filter(k => k !== OPP[m.dir]);
  if (!choices.length) choices = options;
  if (m.frightened) { m.dir = choices[Math.floor(Math.random() * choices.length)]; return; }
  const t = mothTarget(m);
  let best = choices[0], bd = Infinity;
  for (const k of choices) {
    const nx = m.tx + DIRS[k].x, ny = m.ty + DIRS[k].y;
    const d = (nx - t.x) ** 2 + (ny - t.y) ** 2;
    if (d < bd) { bd = d; best = k; }
  }
  m.dir = best;
}

function mothOnTile(m) {
  if (m.state === "leaving" && m.tx === NEST_EXIT.x && m.ty === NEST_EXIT.y) {
    m.state = "active"; m.dir = Math.random() < 0.5 ? "left" : "right";
  } else if (m.state === "eaten" && m.tx === NEST_CENTER.x && m.ty === NEST_CENTER.y) {
    m.state = "leaving"; m.frightened = false;
  }
}

function addScore(n) {
  state.score += n;
  if (!state.extraGiven && state.score >= 10000) { state.extraGiven = true; state.lives++; sfx.life(); }
  if (state.score > state.best) { state.best = state.score; saveBest(state.best); }
}

const BONUS_ITEMS = [
  { name: "dewdrop", value: 100, color: "#7fd8ff" },
  { name: "berry", value: 300, color: "#ff5d7a" },
  { name: "acorn", value: 500, color: "#d79a55" },
  { name: "clover", value: 700, color: "#62e36b" },
  { name: "moonstone", value: 1000, color: "#d8d2ff" },
  { name: "honey", value: 2000, color: "#ffc23d" },
];
function spawnBonus() {
  const item = BONUS_ITEMS[Math.min(state.level - 1, BONUS_ITEMS.length - 1)];
  state.bonus = { ...item, timer: 9.5 };
}
function popup(text, x, y, color = "#ffd25e") { state.popups.push({ text, x, y, t: 0, color }); }

// ---------- Game flow ----------
function newGame() {
  state.score = 0; state.level = 1; state.lives = 3; state.extraGiven = false;
  startLevel();
}
function startLevel() {
  resetGrid();
  state.seedsEaten = 0; state.bonus = null; state.popups = [];
  resetActors();
  toReady();
}
function toReady() {
  state.phase = "ready"; state.phaseTimer = 0;
  showOverlay(`Night ${state.level}`, "Get ready…", "", false);
  sfx.start();
}

function update(dt) {
  state.time += dt;
  for (const p of state.popups) p.t += dt;
  state.popups = state.popups.filter(p => p.t < 1.2);

  if (state.phase === "ready") {
    state.phaseTimer += dt;
    if (state.phaseTimer > 2) { state.phase = "play"; hideOverlay(); }
    return;
  }
  if (state.phase === "dying") {
    state.phaseTimer += dt;
    if (state.phaseTimer > 1.6) {
      state.lives--;
      if (state.lives <= 0) {
        state.phase = "over";
        showOverlay("Lights out", `Final score ${state.score.toLocaleString()}`, "Press Enter or tap to play again", true);
      } else { resetActors(); toReady(); }
    }
    return;
  }
  if (state.phase === "clear") {
    state.phaseTimer += dt;
    if (state.phaseTimer > 2.2) { state.level++; startLevel(); }
    return;
  }
  if (state.phase !== "play") return;

  state.levelTime += dt;
  const S = speeds();

  // Scatter/chase schedule pauses while moths are frightened
  if (state.frightTimer > 0) {
    state.frightTimer -= dt;
    if (state.frightTimer <= 0) { for (const m of moths) m.frightened = false; }
  } else {
    state.modeTimer += dt;
    const dur = MODE_SCHEDULE[state.modeIndex][1];
    if (state.modeTimer >= dur && state.modeIndex < MODE_SCHEDULE.length - 1) {
      state.modeIndex++; state.modeTimer = 0;
      for (const m of moths) if (m.state === "active") reverse(m);
    }
  }

  // Player: allow instant reversal mid-tile
  if (player.want && player.dir && player.want === OPP[player.dir] && player.prog > 0) {
    const d = DIRS[player.dir];
    player.tx += d.x; player.ty += d.y; wrapX(player);
    player.prog = 1 - player.prog; player.dir = player.want; player.face = player.dir;
  }
  if (!player.dir || player.stopped) { playerDecide(player); }
  player.onTile = p => eatAt(p.tx, p.ty);
  advance(player, S.player * dt, playerDecide, playerCanEnter);
  if (state.phase !== "play") return;

  // Bonus item
  if (state.bonus) {
    state.bonus.timer -= dt;
    if (state.bonus.timer <= 0) state.bonus = null;
    else {
      const pp = posOf(player);
      if (Math.abs(pp.x - BONUS_TILE.x) < 0.6 && Math.abs(pp.y - BONUS_TILE.y) < 0.6) {
        addScore(state.bonus.value); popup(String(state.bonus.value), BONUS_TILE.x, BONUS_TILE.y, state.bonus.color);
        sfx.bonus(); state.bonus = null;
      }
    }
  }

  // Moths
  for (const m of moths) {
    if (m.state === "nest") {
      if (state.levelTime >= m.releaseAt) { m.state = "leaving"; }
      else continue;
    }
    let sp = S.moth;
    if (m.state === "eaten") sp = S.eaten;
    else if (m.state === "leaving") sp = S.nest;
    else if (m.frightened) sp = S.fright;
    if (m.state === "active" && m.ty === TUNNEL_ROW && (m.tx <= 3 || m.tx >= COLS - 4)) sp = Math.min(sp, S.tunnel);
    m.onTile = mothOnTile;
    advance(m, sp * dt, mothDecide, (x, y) => mothCanEnter(m, x, y));
  }

  // Collisions
  const pp = posOf(player);
  for (const m of moths) {
    if (m.state !== "active") continue;
    const mp = posOf(m);
    let dx = Math.abs(mp.x - pp.x); if (dx > COLS / 2) dx = COLS - dx;
    const dy = Math.abs(mp.y - pp.y);
    if (dx < 0.6 && dy < 0.6) {
      if (m.frightened) {
        m.frightened = false; m.state = "eaten";
        const pts = 200 * Math.pow(2, state.catchCombo++);
        addScore(pts); popup(String(pts), mp.x, mp.y, "#9fe8ff");
        sfx.catchMoth();
      } else {
        state.phase = "dying"; state.phaseTimer = 0; state.bonus = null;
        sfx.die();
        return;
      }
    }
  }
}

// ---------- Rendering ----------
function draw() {
  const W = COLS * TILE, H = ROWS * TILE;
  ctx.clearRect(0, 0, W, H);

  // starry backdrop
  ctx.fillStyle = "#070b17"; ctx.fillRect(0, 0, W, H);

  const flashing = state.phase === "clear" && Math.floor(state.phaseTimer * 5) % 2 === 1;
  ctx.drawImage(flashing ? MAZE_FLASH : MAZE_NORMAL, 0, 0, W, H);

  // seeds
  const pulse = 0.6 + 0.4 * Math.sin(state.time * 6);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y][x];
    const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2;
    if (c === ".") {
      ctx.fillStyle = "#ffe7a3";
      ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, Math.PI * 2); ctx.fill();
    } else if (c === "o") {
      const r = 5.5 + pulse * 1.5;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.2);
      g.addColorStop(0, "rgba(255,240,180,1)"); g.addColorStop(0.35, "rgba(255,200,80,0.9)"); g.addColorStop(1, "rgba(255,160,40,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // bonus
  if (state.bonus) drawBonus(state.bonus, BONUS_TILE.x * TILE + TILE / 2, BONUS_TILE.y * TILE + TILE / 2);

  // moths
  if (player && state.phase !== "title") {
    for (const m of moths) drawMoth(m);
    drawPlayer();
  }

  // popups
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 12px 'Space Mono', monospace";
  for (const p of state.popups) {
    ctx.globalAlpha = 1 - p.t / 1.2;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x * TILE + TILE / 2, p.y * TILE + TILE / 2 - p.t * 14);
  }
  ctx.globalAlpha = 1;

  if (state.paused) {
    ctx.fillStyle = "rgba(7,11,23,0.6)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd25e"; ctx.font = "28px Bungee, Impact, sans-serif";
    ctx.fillText("PAUSED", W / 2, H / 2);
  }
}

function screenPos(e) {
  const p = posOf(e);
  return { x: p.x * TILE + TILE / 2, y: p.y * TILE + TILE / 2 };
}

function drawPlayer() {
  const { x, y } = screenPos(player);
  const dying = state.phase === "dying";
  const t = dying ? Math.min(state.phaseTimer / 1.4, 1) : 0;
  const angle = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[player.face || "left"];
  const moving = state.phase === "play" && player.dir && !player.stopped;
  const flap = moving ? Math.sin(state.time * 30) : Math.sin(state.time * 8) * 0.4;

  // glow halo
  const haloR = 22 * (1 - t) + 2;
  const g = ctx.createRadialGradient(x, y, 0, x, y, haloR);
  g.addColorStop(0, `rgba(255,230,120,${0.55 * (1 - t)})`); g.addColorStop(1, "rgba(255,230,120,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, haloR, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + (dying ? t * Math.PI * 4 : 0));
  const s = 1 - t * 0.9;
  ctx.scale(s, s);

  // wings
  ctx.fillStyle = "rgba(210,235,255,0.55)";
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.rotate(side * (0.9 + flap * 0.35));
    ctx.beginPath(); ctx.ellipse(-2, side * 6, 7, 3.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // glowing abdomen (behind)
  ctx.fillStyle = "#ffd25e"; ctx.shadowColor = "#ffd25e"; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.ellipse(-4, 0, 6.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // head/thorax
  ctx.fillStyle = "#2b2f4a";
  ctx.beginPath(); ctx.ellipse(4, 0, 5.2, 5, 0, 0, Math.PI * 2); ctx.fill();
  // eyes
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(6, -2.4, 1.7, 0, Math.PI * 2); ctx.arc(6, 2.4, 1.7, 0, Math.PI * 2); ctx.fill();
  // antennae
  ctx.strokeStyle = "#2b2f4a"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(8, -2); ctx.quadraticCurveTo(12, -4, 12, -7); ctx.moveTo(8, 2); ctx.quadraticCurveTo(12, 4, 12, 7); ctx.stroke();
  ctx.restore();
}

function drawMoth(m) {
  const { x, y } = screenPos(m);
  const bob = m.state === "nest" ? Math.sin(state.time * 5 + m.index) * 3 : 0;
  const flap = Math.sin(state.time * 18 + m.index * 1.7);
  const fr = m.frightened && m.state !== "eaten";
  const flashingEnd = fr && state.frightTimer < 2 && Math.floor(state.time * 8) % 2 === 0;

  ctx.save();
  ctx.translate(x, y + bob);

  if (m.state !== "eaten") {
    const body = fr ? (flashingEnd ? "#f4f7ff" : "#3f5bd9") : m.color;
    // wings: two pairs, flapping by squashing horizontally
    const spread = 0.65 + 0.35 * Math.abs(flap);
    ctx.fillStyle = body;
    ctx.shadowColor = body; ctx.shadowBlur = fr ? 6 : 10;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(side * 13 * spread, -12, side * 11 * spread, 1);
      ctx.quadraticCurveTo(side * 7 * spread, 3, 0, 1);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 1);
      ctx.quadraticCurveTo(side * 9 * spread, 4, side * 6 * spread, 10);
      ctx.quadraticCurveTo(side * 2, 8, 0, 4);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    // wing spots
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.arc(-6 * spread, -4, 2, 0, Math.PI * 2); ctx.arc(6 * spread, -4, 2, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = fr ? "#1d2a6b" : "#3a2a3a";
    ctx.beginPath(); ctx.ellipse(0, 1, 2.6, 7, 0, 0, Math.PI * 2); ctx.fill();
    // feathery antennae
    ctx.strokeStyle = fr ? "#9fb3ff" : body; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-1, -5); ctx.quadraticCurveTo(-4, -10, -7, -11); ctx.moveTo(1, -5); ctx.quadraticCurveTo(4, -10, 7, -11); ctx.stroke();
  }

  // eyes (always drawn; alone when eaten)
  if (fr) {
    ctx.fillStyle = flashingEnd ? "#ff6b8b" : "#ffe7a3";
    ctx.fillRect(-3.5, -4, 2, 2); ctx.fillRect(1.5, -4, 2, 2);
  } else {
    const d = m.dir ? DIRS[m.dir] : { x: 0, y: 1 };
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-2.6, -3.5, 2.4, 0, Math.PI * 2); ctx.arc(2.6, -3.5, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(-2.6 + d.x * 1.1, -3.5 + d.y * 1.1, 1.1, 0, Math.PI * 2); ctx.arc(2.6 + d.x * 1.1, -3.5 + d.y * 1.1, 1.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBonus(b, x, y) {
  const blink = b.timer < 2 && Math.floor(state.time * 8) % 2 === 0;
  if (blink) return;
  ctx.save(); ctx.translate(x, y + Math.sin(state.time * 4) * 1.5);
  ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 12;
  switch (b.name) {
    case "dewdrop":
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.quadraticCurveTo(7, 2, 0, 7); ctx.quadraticCurveTo(-7, 2, 0, -8); ctx.fill(); break;
    case "berry":
      for (const [bx, by] of [[-3, 0], [3, 0], [0, 4], [0, -3]]) { ctx.beginPath(); ctx.arc(bx, by + 1, 3.4, 0, Math.PI * 2); ctx.fill(); }
      break;
    case "acorn":
      ctx.beginPath(); ctx.ellipse(0, 2, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#6b4a2a"; ctx.beginPath(); ctx.ellipse(0, -3, 6.5, 3.5, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(-1, -9, 2, 4); break;
    case "clover":
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.beginPath(); ctx.arc(Math.cos(a) * 4, Math.sin(a) * 4, 3.6, 0, Math.PI * 2); ctx.fill(); }
      break;
    case "moonstone":
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(7, 0); ctx.lineTo(0, 8); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill(); break;
    default:
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 7); }
      ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------- HUD & overlay ----------
const el = id => document.getElementById(id);
const hud = { score: el("hud-score"), best: el("hud-best"), level: el("hud-level"), lives: el("hud-lives") };
let lastHud = "";
function updateHud() {
  const key = `${state.score}|${state.best}|${state.level}|${state.lives}`;
  if (key === lastHud) return;
  lastHud = key;
  hud.score.textContent = state.score.toLocaleString();
  hud.best.textContent = state.best.toLocaleString();
  hud.level.textContent = state.level;
  hud.lives.textContent = "✦".repeat(Math.max(0, state.lives)) || "0";
}
const overlay = el("overlay");
function showOverlay(title, text, hint, dim) {
  el("ov-title").textContent = title;
  el("ov-text").textContent = text;
  el("ov-hint").textContent = hint;
  el("ov-hint").hidden = !hint;
  overlay.classList.toggle("dim", !!dim);
  overlay.hidden = false;
}
function hideOverlay() { overlay.hidden = true; }

// ---------- Input ----------
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
};
function steer(dir) {
  if (state.phase === "title" || state.phase === "over") { begin(); }
  if (player) player.want = dir;
}
function begin() {
  if (state.phase === "title" || state.phase === "over") { beep(1, 0.001, "sine", 0.0001); newGame(); }
}
function togglePause() {
  if (state.phase === "title" || state.phase === "over") return;
  state.paused = !state.paused;
  el("btn-pause").textContent = state.paused ? "Resume" : "Pause";
}
function toggleSound() {
  soundOn = !soundOn;
  el("btn-sound").textContent = soundOn ? "Sound: on" : "Sound: off";
}

window.addEventListener("keydown", e => {
  if (KEYMAP[e.key]) { e.preventDefault(); steer(KEYMAP[e.key]); return; }
  if (e.key === "Enter" || e.key === " ") {
    if (document.activeElement && document.activeElement.tagName === "BUTTON" && e.key === " ") return;
    e.preventDefault(); begin();
  }
  if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
  if (e.key === "m" || e.key === "M") toggleSound();
});
el("btn-pause").addEventListener("click", togglePause);
el("btn-sound").addEventListener("click", toggleSound);
document.querySelectorAll(".pad button").forEach(b => {
  b.addEventListener("pointerdown", e => { e.preventDefault(); steer(b.dataset.dir); });
});

// swipe
let touchStart = null;
const stage = document.querySelector(".stage");
stage.addEventListener("touchstart", e => { const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY }; }, { passive: true });
stage.addEventListener("touchmove", e => {
  if (!touchStart) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
    steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    touchStart = { x: t.clientX, y: t.clientY };
  }
  e.preventDefault();
}, { passive: false });
stage.addEventListener("touchend", () => { touchStart = null; });
stage.addEventListener("click", () => begin());

document.addEventListener("visibilitychange", () => {
  if (document.hidden && (state.phase === "play" || state.phase === "ready") && !state.paused) togglePause();
});

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; // avoid tunnelling through walls after a stall
  if (!state.paused) update(dt);
  draw();
  updateHud();
  requestAnimationFrame(frame);
}

// title screen preview: show maze with actors parked
resetActors();
updateHud();
requestAnimationFrame(frame);

// test hook
window.__fireflyMaze = { state, get player() { return player; }, get moths() { return moths; }, TOTAL_SEEDS };
})();
</script>
</body>
</html>
