<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: one narrow column — heading, add box, the list, a small footer count. */
:root {
  --bg: #f3f5f2; --card: #ffffff; --ink: #1f2a24; --muted: #6b7a70; --line: #dde3dc; --accent: #2f7d5b;
  --display: "Fraunces", Georgia, serif; --body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a17; --card: #1c2420; --ink: #e6ede8; --muted: #93a39a; --line: #2c3731; --accent: #5cc595; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141a17; --card: #1c2420; --ink: #e6ede8; --muted: #93a39a; --line: #2c3731; --accent: #5cc595; color-scheme: dark; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body);
  padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font: 600 2rem/1.1 var(--display); margin: 0; }
.date { color: var(--muted); margin: 0; }
form { display: flex; gap: 8px; }
input[type="text"] {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
button { font: inherit; cursor: pointer; border-radius: 8px; }
.add { background: var(--accent); color: var(--card); border: 0; padding: 10px 16px; font-weight: 500; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
li input { width: 18px; height: 18px; accent-color: var(--accent); }
li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
li.done span { text-decoration: line-through; color: var(--muted); }
.remove { background: none; border: 0; color: var(--muted); font-size: 1.2rem; padding: 0 6px; }
.empty { padding: 20px; color: var(--muted); text-align: center; }
footer { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Daily List</h1>
    <p class="date" id="today"></p>
  </div>

  <form id="add-form">
    <input type="text" id="new-task" placeholder="Add something to do…" aria-label="New task" autocomplete="off">
    <button class="add" type="submit">Add</button>
  </form>

  <ul id="list"></ul>
  <footer id="count"></footer>
</main>

<script>
// 1. The list of tasks. Each task has text and a done flag.
//    It starts with a few examples so the page isn't empty.
let tasks = [
  { text: "Water the plants", done: true },
  { text: "Call the dentist", done: false },
  { text: "Buy milk and bread", done: false },
];

// 2. Load any saved tasks from this browser (if there are some).
try {
  const saved = localStorage.getItem("daily-list");
  if (saved) tasks = JSON.parse(saved);
} catch (e) { /* saving isn't available here; that's fine */ }

function save() {
  try { localStorage.setItem("daily-list", JSON.stringify(tasks)); } catch (e) {}
}

// 3. Draw the list on the page from the tasks array.
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (tasks.length === 0) {
    list.innerHTML = '<li class="empty">Nothing here yet. Add your first task above.</li>';
  }

  tasks.forEach((task, i) => {
    const li = document.createElement("li");
    if (task.done) li.className = "done";

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = task.done;
    box.setAttribute("aria-label", "Mark done: " + task.text);
    box.onchange = () => { task.done = box.checked; save(); render(); };

    const label = document.createElement("span");
    label.textContent = task.text;

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "×";
    remove.setAttribute("aria-label", "Delete: " + task.text);
    remove.onclick = () => { tasks.splice(i, 1); save(); render(); };

    li.append(box, label, remove);
    list.append(li);
  });

  const left = tasks.filter(t => !t.done).length;
  document.getElementById("count").textContent =
    tasks.length === 0 ? "" : `${left} of ${tasks.length} left to do`;
}

// 4. When the form is submitted, add a new task.
document.getElementById("add-form").addEventListener("submit", (event) => {
  event.preventDefault();               // stop the page from reloading
  const input = document.getElementById("new-task");
  const text = input.value.trim();
  if (text === "") return;              // ignore empty entries
  tasks.push({ text: text, done: false });
  input.value = "";
  save();
  render();
});

// 5. Show today's date and draw the list for the first time.
document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
render();
</script>
</body>
</html>
